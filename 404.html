<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>AURELLE — Back to the storefront</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var cut = path.indexOf('/', 1);
        var root = cut === -1 ? '/' : path.slice(0, cut + 1);
        window.location.replace(root);
      })();
    </script>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f2ec;
        color: #14120f;
        font-family: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .brand {
        margin: 0 0 1.5rem;
        font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        font-size: 1.5rem;
        letter-spacing: 0.42em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        line-height: 1.15;
      }
      p { margin: 0 0 2rem; color: #5c554c; font-size: 0.95rem; }
      a {
        display: inline-block;
        padding: 0.9rem 2rem;
        border: 1px solid #14120f;
        color: #14120f;
        text-decoration: none;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      a:hover { background: #14120f; color: #f6f2ec; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Aurelle</p>
      <h1>Taking you back to the storefront</h1>
      <p>This address does not exist. If nothing happens, use the link below.</p>
      <a href="./">Open the shop</a>
    </main>
  </body>
</html>
